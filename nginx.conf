server {
    listen 80;
    server_name localhost;

    # Tamaño máximo de subida
    client_max_body_size 20M;

    # Resolver interno de Docker con TTL corto: obliga a nginx a re-resolver
    # el upstream en caliente en vez de resolverlo una sola vez al arrancar.
    # Sin esto, si nginx arranca antes que el contenedor de Django (p. ej. al
    # reiniciar el servidor), la consulta DNS se fuga al DNS público y queda
    # cacheada para siempre una IP inválida (127.0.53.53, colisión de ICANN).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Archivos Estáticos
    location /static/ {
        alias /app/static/;
    }

    # Archivos Media
    location /media/ {
        alias /app/media/;
    }

    # Todo lo demás va a Django (Gunicorn)
    location / {
        # Usar una variable fuerza la re-resolución por petición vía el
        # resolver de arriba. "portfolio-web" (container_name) en vez de
        # "web" porque ".web" ya es un gTLD real: si la consulta se fuga
        # al DNS público, un nombre con guion da NXDOMAIN y no una IP falsa.
        set $upstream_django portfolio-web:8000;
        proxy_pass http://$upstream_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}